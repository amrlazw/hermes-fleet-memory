[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-fleet-memory"
version = "1.0.0"
description = "Distributed vector memory, hardware-enforced domain firewall, and NAT-traversing execution mesh for multi-instance Hermes fleets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Amirul Azwan", email = "amirulazw94@gmail.com" }
]
keywords = ["hermes", "multi-agent", "vector-memory", "qdrant", "fastmcp", "fastapi"]
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
client = [
    "qdrant-client>=1.10.0",
    "fastembed>=0.3.0",
    "mcp>=1.0.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools]
py-modules = ["fleet_wizard"]

[tool.setuptools.packages.find]
where = ["."]
include = ["client*", "server*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
