<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dashboard-token" content="__TOKEN__">
<title>Fleet Office</title>
<style>
  /* The room is the interface. Everything else floats over it: who is here (top left),
     history (top right, closed by default), and the chat box (bottom).
     Neutral paper base, one accent for sending, one identity colour per agent.
     System fonts: a local tool should not fetch web fonts. */
  :root {
    --bg: #f5f3ee; --surface: #ffffff; --ink: #1d1f22; --muted: #5d6166; --line: #e3dfd6;
    --accent: #1f6b58; --accent-ink: #ffffff; --warn: #a3521a; --ok: #2c7a3f; --mine: #e4f1ec;
    --floor: #e7e0d2; --wood: #b88a5c; --chair: #4a4f57; --skin: #e9c9a6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a; --surface: #1f2226; --ink: #e9e7e2; --muted: #a2a6ac; --line: #353a40;
      --accent: #5bbf9f; --accent-ink: #0d1a15; --warn: #e39a62; --ok: #6cc486; --mine: #1f3a31;
      --floor: #25282c; --wood: #6d5641; --chair: #3a3e45; --skin: #d9b58f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171a; --surface: #1f2226; --ink: #e9e7e2; --muted: #a2a6ac; --line: #353a40;
    --accent: #5bbf9f; --accent-ink: #0d1a15; --warn: #e39a62; --ok: #6cc486; --mine: #1f3a31;
    --floor: #25282c; --wood: #6d5641; --chair: #3a3e45; --skin: #d9b58f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgb(0 0 0 / .14);
  }

  /* ---- labels and speech bubbles that follow the agents ---- */
  .tag { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; font-size: 13px; line-height: 1.25; }
  .tag b { display: block; font-size: 14px; }
  .tag span { color: var(--muted); }
  .tag.working span { color: var(--ok); font-weight: 600; }
  .tag.offline { opacity: .55; }
  .dots i { display: inline-block; width: 4px; height: 4px; margin: 0 1px; border-radius: 50%; background: currentColor; vertical-align: middle; }
  .tag.working .dots i { animation: blink 1.2s infinite; }
  .tag.working .dots i:nth-child(2) { animation-delay: .2s; }
  .tag.working .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  .bubble {
    position: absolute; transform: translate(-50%, calc(-100% - 46px)); width: max-content; max-width: 280px;
    padding: 9px 12px; font-size: 13.5px; transition: opacity .35s; pointer-events: auto;
  }
  .bubble small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; margin-left: -6px;
    background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg);
  }

  /* ---- top bar: who is here, theme, history ---- */
  .top { position: fixed; top: 14px; left: 16px; right: 16px; display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .title { padding: 8px 12px; font-weight: 650; }
  .title span { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  #roster { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; font-size: 13.5px;
  }
  .chip[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; }
  .chip small { color: var(--muted); font-weight: 400; }
  .chip.working small { color: var(--ok); font-weight: 600; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .spacer { flex: 1; }
  .btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13.5px; }

  /* ---- chat box and the answer card above it ---- */
  .dock { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(680px, calc(100vw - 32px)); display: grid; gap: 10px; }
  #answer { padding: 12px 14px; display: none; }
  #answer.show { display: block; }
  #answer .q { color: var(--muted); font-size: 12.5px; margin: 0 0 4px; }
  #answer .who { font-weight: 600; }
  #answer .who.working { color: var(--ok); }
  #answer p { margin: 2px 0 0; overflow-wrap: anywhere; max-height: 30vh; overflow: auto; }
  #answer .close { float: right; background: none; border: 0; cursor: pointer; color: var(--muted); padding: 0 0 0 10px; font-size: 13px; }
  form { padding: 10px; display: grid; gap: 8px; }
  .to { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .to button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
  .to button[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; background: var(--surface); }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; resize: none; min-height: 42px; max-height: 140px;
  }
  .send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 650; cursor: pointer; white-space: nowrap; }
  .send:disabled { opacity: .5; cursor: not-allowed; }
  #form-msg { font-size: 12.5px; color: var(--muted); min-height: 1em; }
  #form-msg.error { color: var(--warn); }

  /* ---- history drawer (chat style), closed by default ---- */
  #history {
    position: fixed; top: 70px; right: 16px; bottom: 18px; width: min(400px, calc(100vw - 32px));
    display: none; grid-template-rows: auto minmax(0, 1fr);
  }
  #history.open { display: grid; }
  #history header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #history header b { margin-right: auto; }
  .filters button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; }
  .filters button[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; }
  #log { overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 8px 11px; border-radius: 12px; font-size: 13.5px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg small { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; white-space: normal; }
  .msg.agent { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); }
  .msg.mine { align-self: flex-end; background: var(--mine); }
  .msg.between { align-self: center; max-width: 92%; font-size: 12.5px; color: var(--muted); text-align: center; padding: 2px 6px; }
  .msg.between b { color: var(--ink); font-weight: 600; }
  .typing { font-size: 12.5px; color: var(--ok); }
  .empty { color: var(--muted); font-size: 13.5px; }

  .fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; color: var(--muted); text-align: center; pointer-events: none; }
  .hint { position: fixed; left: 16px; bottom: 18px; font-size: 12px; color: var(--muted); pointer-events: none; max-width: 200px; }

  @media (max-width: 760px) {
    .title span, .hint { display: none; }
    #history { top: auto; height: 60vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble { transition: none; }
    .tag.working .dots i { animation: none; opacity: 1; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scene" aria-label="3D office showing each agent at a desk"><div class="overlay" id="overlay"></div></div>

<div class="top">
  <div class="title card">Fleet Office<span id="where">Local sandbox</span></div>
  <div id="roster" role="group" aria-label="Agents"></div>
  <span class="spacer"></span>
  <button class="btn" id="theme" type="button">Theme: system</button>
  <button class="btn" id="history-btn" type="button" aria-expanded="false" aria-controls="history">History</button>
</div>

<div class="hint">Drag to turn the room. Click an agent to talk to it.</div>

<aside id="history" class="card" aria-label="Conversation history">
  <header>
    <b>History</b>
    <span class="filters" id="filters"></span>
    <button class="btn" id="history-close" type="button">Close</button>
  </header>
  <div id="log" aria-live="polite"></div>
</aside>

<div class="dock">
  <div id="answer" class="card" aria-live="polite"></div>
  <form id="task-form" class="card">
    <div class="to"><span>To</span><span id="targets" role="group" aria-label="Send to"></span></div>
    <div class="row">
      <textarea id="task-text" rows="1" aria-label="Message" maxlength="2000" placeholder="Pick an agent, then type a message or a task…"></textarea>
      <button class="send" id="send" type="submit" disabled>Send</button>
    </div>
    <div id="form-msg"></div>
  </form>
</div>

<script type="module">
// ------------------------------------------------------------------ data, chat box, history
const TOKEN = document.querySelector('meta[name="dashboard-token"]').content;
const COLORS = ["#d9822b", "#3a78c2", "#8a5cc2", "#2e9e8f", "#c2455d", "#6b8e23"];
const state = { agents: [], events: [], tasks: [], selected: null, seen: new Set(), first: true, now: Date.now() / 1000, filter: "all", dismissed: null };
const colorOf = name => COLORS[Math.max(0, state.agents.findIndex(a => a.name === name)) % COLORS.length];
const titleOf = name => name === "you" ? "You" : (state.agents.find(a => a.name === name)?.title
  ?? (name ? name[0].toUpperCase() + name.slice(1) : "Someone"));
window.fleet = { state, colorOf, titleOf };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clock = ts => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const STATUS = { working: "Working", idle: "Idle", offline: "Offline" };

// A task's answer is the agent's last reply between this task and your next one to the
// same agent. A message from another agent only belongs to it if the agent reached out
// first; otherwise it is someone else's thread. Asked a peer and no word back yet means
// the task is still open.
function answerTo(t) {
  const next = state.tasks.filter(o => o.agent === t.agent && o.started > t.started).at(-1);
  const until = next ? next.started : Infinity;
  // The task stays open while the agent is waiting on a peer, or has heard back from one
  // and not yet passed that on. A reply sent while still waiting ("I've asked Chester,
  // will relay") does not close it.
  let delegated = false, answer = null, waitingOnPeer = null, owesAnswer = null;
  for (const e of state.events) {
    if (e.ts < t.started) continue;
    if (e.ts >= until) break;
    if (e.kind === "message" && e.from === t.agent) { delegated = true; waitingOnPeer = e.ts; }
    else if (e.kind === "message" && e.to === t.agent) { if (!delegated) break; waitingOnPeer = null; owesAnswer = e.ts; }
    else if (e.kind === "reply" && e.from === t.agent) { answer = e.text; owesAnswer = null; }
  }
  const since = waitingOnPeer ?? owesAnswer;
  const busy = state.agents.some(a => a.status === "working");
  const open = t.status === "sending" || (since !== null && state.now - since < 600) || (!next && busy && t.status === "done" && state.now - t.started < 600);
  return { answer: answer || t.reply, open };
}

function renderRoster() {
  $("roster").innerHTML = state.agents.map(a => `
    <button type="button" class="chip ${a.status}" data-pick="${esc(a.name)}" aria-pressed="${state.selected === a.name}" title="${esc(a.role)}">
      <span class="swatch" style="background:${colorOf(a.name)}"></span>${esc(a.title)} <small>${STATUS[a.status]}</small></button>`).join("");
  $("targets").innerHTML = state.agents.map(a => `
    <button type="button" data-pick="${esc(a.name)}" aria-pressed="${state.selected === a.name}">
      <span class="swatch" style="background:${colorOf(a.name)}"></span>${esc(a.title)}</button>`).join("");
  $("where").textContent = `${state.agents.length} agents, local sandbox`;
}

function renderAnswer() {
  const t = state.tasks[0];
  const box = $("answer");
  if (!t || state.dismissed === t.id) { box.className = "card"; return; }
  const { answer, open } = answerTo(t);
  const name = esc(titleOf(t.agent));
  box.className = "card show";
  box.innerHTML = `<button class="close" type="button" data-dismiss="${t.id}">Hide</button>
    <p class="q">You asked ${name} at ${clock(t.started)}: ${esc(t.text.slice(0, 140))}</p>
    ${open
      ? `<span class="who working">${name} is working on it…</span>${answer ? `<p>${esc(answer)}</p>` : ""}`
      : t.status === "failed"
        ? `<span class="who" style="color:var(--warn)">${name} did not finish.</span><p>${esc(answer || "")}</p>`
        : `<span class="who" style="color:${colorOf(t.agent)}">${name}</span><p>${esc(answer || "(no reply)")}</p>`}`;
}

function renderHistory() {
  const log = $("log");
  const f = state.filter;
  $("filters").innerHTML = ["all", ...state.agents.map(a => a.name)].map(n =>
    `<button type="button" data-filter="${esc(n)}" aria-pressed="${f === n}">${n === "all" ? "Everyone" : esc(titleOf(n))}</button>`).join(" ");
  if (!$("history").classList.contains("open")) return;
  const events = state.events.filter(e => f === "all" || e.from === f || e.to === f);
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const rows = events.map(e => {
    if (e.kind === "task" || e.from === "you")
      return `<div class="msg mine"><small>You to ${esc(titleOf(e.to))} · ${clock(e.ts)}</small>${esc(e.text)}</div>`;
    if (e.kind === "reply")
      return `<div class="msg agent"><small style="color:${colorOf(e.from)}">${esc(titleOf(e.from))} · ${clock(e.ts)}</small>${esc(e.text)}</div>`;
    return `<div class="msg between"><b style="color:${colorOf(e.from)}">${esc(titleOf(e.from))}</b> to <b style="color:${colorOf(e.to)}">${esc(titleOf(e.to))}</b> · ${clock(e.ts)}<br>${esc(e.text)}</div>`;
  });
  const typing = state.agents.filter(a => a.status === "working" && (f === "all" || f === a.name))
    .map(a => `<div class="typing">${esc(a.title)} is working…</div>`);
  log.innerHTML = rows.concat(typing).join("") || `<p class="empty">Nothing yet. Send an agent a message below and the conversation shows up here.</p>`;
  if (nearBottom) log.scrollTop = log.scrollHeight;
}

function select(name) {
  state.selected = name;
  renderRoster();
  $("send").disabled = !name;
  $("form-msg").className = "";
  $("form-msg").textContent = "";
  $("task-text").placeholder = name ? `Message ${titleOf(name)}…` : "Pick an agent, then type a message or a task…";
  if (name) $("task-text").focus();
}
document.addEventListener("click", e => {
  const pick = e.target.closest("[data-pick]");
  if (pick) return select(pick.dataset.pick);
  const filter = e.target.closest("[data-filter]");
  if (filter) { state.filter = filter.dataset.filter; renderHistory(); $("log").scrollTop = $("log").scrollHeight; return; }
  const dismiss = e.target.closest("[data-dismiss]");
  if (dismiss) { state.dismissed = dismiss.dataset.dismiss; renderAnswer(); }
});
window.addEventListener("fleet:select", e => select(e.detail));

function toggleHistory(open) {
  $("history").classList.toggle("open", open);
  $("history-btn").setAttribute("aria-expanded", String(open));
  if (open) { renderHistory(); $("log").scrollTop = $("log").scrollHeight; }
}
$("history-btn").addEventListener("click", () => toggleHistory(!$("history").classList.contains("open")));
$("history-close").addEventListener("click", () => toggleHistory(false));

const text = $("task-text");
text.addEventListener("input", () => { text.style.height = "auto"; text.style.height = `${Math.min(text.scrollHeight, 140)}px`; });
text.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("task-form").requestSubmit(); }
});

$("task-form").addEventListener("submit", async e => {
  e.preventDefault();
  const body = text.value.trim();
  const msg = $("form-msg");
  if (!state.selected) { msg.className = "error"; msg.textContent = "Pick who to send it to first."; return; }
  if (!body) return;
  $("send").disabled = true;
  try {
    const res = await fetch("/api/task", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Dashboard-Token": TOKEN },
      body: JSON.stringify({ agent: state.selected, text: body }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    text.value = ""; text.style.height = "";
    msg.className = ""; msg.textContent = "";
    state.dismissed = null;
    window.dispatchEvent(new CustomEvent("fleet:event", { detail: { kind: "task", from: "you", to: state.selected, text: body, local: true } }));
    poll();
  } catch (err) {
    msg.className = "error"; msg.textContent = `Not sent: ${err.message}`;
  } finally {
    $("send").disabled = !state.selected;
  }
});

async function poll() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    Object.assign(state, { agents: data.agents, events: data.events, tasks: data.tasks, now: data.now });
    const fresh = data.events.filter(e => !state.seen.has(e.id));
    fresh.forEach(e => state.seen.add(e.id));
    renderRoster(); renderAnswer(); renderHistory();
    window.dispatchEvent(new CustomEvent("fleet:state", { detail: state }));
    if (!state.first) fresh.forEach(e => window.dispatchEvent(new CustomEvent("fleet:event", { detail: e })));
    state.first = false;
    $("form-msg").classList.contains("error") && $("form-msg").textContent.startsWith("Lost") && ($("form-msg").textContent = "");
  } catch (err) {
    $("form-msg").className = "error";
    $("form-msg").textContent = `Lost contact with the dashboard server (${err.message}). Is dashboard.py still running?`;
  }
}
poll();
setInterval(poll, 1500);

// Theme: follow the system unless the viewer picks one. Stored per browser only.
const themes = ["system", "light", "dark"];
let theme = "system";
try { theme = localStorage.getItem("fleet-theme") || "system"; } catch {}
function applyTheme() {
  if (theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  $("theme").textContent = `Theme: ${theme}`;
  window.dispatchEvent(new Event("fleet:theme"));
}
$("theme").addEventListener("click", () => {
  theme = themes[(themes.indexOf(theme) + 1) % themes.length];
  try { localStorage.setItem("fleet-theme", theme); } catch {}
  applyTheme();
});
applyTheme();
</script>

<script type="module">
// ------------------------------------------------------------------ the 3D office
// Only real state moves anything: an agent types while it is working, and an envelope
// crosses the room when one agent actually messages another.
let THREE, OrbitControls;
try {
  THREE = await import("three");
  ({ OrbitControls } = await import("three/addons/controls/OrbitControls.js"));
} catch {
  const note = document.createElement("div");
  note.className = "fallback";
  note.textContent = "The 3D office needs three.js from cdn.jsdelivr.net, which did not load. The chat box and History still work.";
  document.body.append(note);
}

if (THREE) {
  const { fleet } = window;
  const host = document.getElementById("scene");
  const overlay = document.getElementById("overlay");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  host.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
  camera.position.set(0, 7, 11.5);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.4, 0);
  controls.enableDamping = true;
  controls.minDistance = 6; controls.maxDistance = 22;
  controls.maxPolarAngle = Math.PI / 2.15;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8170, 1.1));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(5, 10, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 });
  scene.add(sun);

  const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85 });
  const floorMat = mat(css("--floor")), woodMat = mat(css("--wood")), chairMat = mat(css("--chair")), skinMat = mat(css("--skin"));
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMat);
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
  scene.add(floor);

  function box(w, h, d, m, x, y, z) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    b.position.set(x, y, z); b.castShadow = b.receiveShadow = true;
    return b;
  }

  // The operator's in-tray at the front of the room: messages from you start here.
  const TRAY = new THREE.Vector3(0, 1.1, 5.2);
  const tray = new THREE.Group();
  tray.add(box(1.0, 0.08, 0.7, woodMat, 0, 0.9, 0));
  [-0.4, 0.4].forEach(x => tray.add(box(0.08, 0.9, 0.08, woodMat, x, 0.45, 0)));
  tray.position.set(0, 0, 5.2);
  scene.add(tray);

  const desks = new Map();

  function makeDesk(name, color) {
    const g = new THREE.Group();
    const agentMat = mat(color);
    g.add(box(2.4, 0.1, 1.2, woodMat, 0, 0.9, 0));
    [[-1.1, -0.5], [1.1, -0.5], [-1.1, 0.5], [1.1, 0.5]].forEach(([x, z]) => g.add(box(0.08, 0.9, 0.08, woodMat, x, 0.45, z)));
    g.add(box(1.0, 0.62, 0.06, mat("#2b2e33"), 0, 1.37, 0.25));
    g.add(box(0.08, 0.3, 0.08, mat("#2b2e33"), 0, 1.08, 0.25));
    g.add(box(0.7, 0.03, 0.22, mat("#3b3f46"), 0, 0.97, -0.25));
    g.add(box(0.7, 0.08, 0.65, chairMat, 0, 0.62, -0.95));
    g.add(box(0.7, 0.8, 0.08, chairMat, 0, 1.05, -1.28));
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.45, 6, 16), agentMat);
    body.position.set(0, 1.18, -0.95); body.castShadow = true;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 24, 16), skinMat);
    head.position.set(0, 1.78, -0.95); head.castShadow = true;
    const eyeMat = mat("#22252a");
    [-0.09, 0.09].forEach(x => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), eyeMat);
      eye.position.set(x, 0.04, 0.23); head.add(eye);
    });
    const hands = [-0.18, 0.18].map(x => {
      const h = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 10), skinMat);
      h.position.set(x, 1.02, -0.3); g.add(h); return h;
    });
    g.add(body, head);
    const screenLight = new THREE.PointLight(color, 0, 2.2);
    screenLight.position.set(0, 1.4, 0.05);
    g.add(screenLight);

    const labelEl = document.createElement("div");
    labelEl.className = "tag";
    const bubbleEl = document.createElement("div");
    bubbleEl.className = "bubble card"; bubbleEl.style.opacity = 0;
    overlay.append(bubbleEl, labelEl);

    g.traverse(o => { o.userData.agent = name; });
    scene.add(g);
    return { group: g, body, head, hands, screenLight, agentMat, color, labelEl, bubbleEl, bubbleUntil: 0 };
  }

  function layout() {
    const names = [...desks.keys()];
    const n = names.length, spacing = 4.4;
    names.forEach((name, i) => {
      const d = desks.get(name);
      if (n <= 4) d.group.position.set((i - (n - 1) / 2) * spacing, 0, 0);
      else {
        const a = (i / n) * Math.PI * 2, r = Math.max(4, n * 0.9);
        d.group.position.set(Math.sin(a) * r, 0, Math.cos(a) * r - 1);
        d.group.lookAt(0, 0, 5);
      }
    });
  }

  window.addEventListener("fleet:state", e => {
    let changed = false;
    e.detail.agents.forEach(a => {
      if (!desks.has(a.name)) { desks.set(a.name, makeDesk(a.name, fleet.colorOf(a.name))); changed = true; }
      const d = desks.get(a.name);
      d.status = a.status;
      d.labelEl.className = `tag ${a.status}`;
      d.labelEl.innerHTML = `<b>${esc(a.title)}</b><span>${{ working: "Working", idle: "Idle", offline: "Offline" }[a.status]}${a.status === "working" ? ' <span class="dots"><i></i><i></i><i></i></span>' : ""}</span>`;
      d.agentMat.color.set(a.status === "offline" ? "#8b8f96" : d.color);
    });
    if (changed) layout();
  });

  window.addEventListener("fleet:theme", () => {
    floorMat.color.set(css("--floor")); woodMat.color.set(css("--wood"));
    chairMat.color.set(css("--chair")); skinMat.color.set(css("--skin"));
    scene.background = new THREE.Color(css("--bg"));
  });
  scene.background = new THREE.Color(css("--bg"));

  function say(name, who, text, ms = 12000) {
    const d = desks.get(name);
    if (!d) return;
    const t = String(text);
    d.bubbleEl.innerHTML = `<small>${esc(who)}</small>${esc(t.slice(0, 160))}${t.length > 160 ? "…" : ""}`;
    d.bubbleUntil = performance.now() + ms;
  }

  const envelopes = [];
  const envGeo = new THREE.BoxGeometry(0.42, 0.04, 0.3);
  function send(fromPos, toPos, color) {
    const m = new THREE.Mesh(envGeo, new THREE.MeshStandardMaterial({ color: "#fbfaf6", roughness: 0.6 }));
    const flap = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.045, 0.1), new THREE.MeshStandardMaterial({ color }));
    flap.position.z = -0.1; m.add(flap);
    m.castShadow = true;
    scene.add(m);
    envelopes.push({ m, from: fromPos.clone(), to: toPos.clone(), t0: performance.now(), dur: reduced ? 1 : 1500 });
  }
  const headPos = name => desks.get(name)?.head.getWorldPosition(new THREE.Vector3()) ?? null;

  window.addEventListener("fleet:event", e => {
    const ev = e.detail;
    if (ev.kind === "message") {
      const from = headPos(ev.from), to = headPos(ev.to);
      if (from && to) send(from, to, fleet.colorOf(ev.from));
      say(ev.from, `to ${fleet.titleOf(ev.to)}`, ev.text);
    } else if (ev.kind === "task") {
      const to = headPos(ev.to);
      if (to && ev.local) send(TRAY, to, getComputedStyle(document.documentElement).getPropertyValue("--accent").trim());
      if (ev.local) say(ev.to, "message from you", ev.text, 6000);
    } else if (ev.kind === "reply") {
      say(ev.from, fleet.titleOf(ev.from), ev.text, 20000);
    }
  });

  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  let downAt = null;
  renderer.domElement.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener("pointerup", e => {
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects([...desks.values()].map(d => d.group), true)[0];
    if (hit?.object.userData.agent) window.dispatchEvent(new CustomEvent("fleet:select", { detail: hit.object.userData.agent }));
  });

  function resize() {
    const { clientWidth: w, clientHeight: h } = host;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(host);
  resize();

  const v = new THREE.Vector3();
  function place(el, pos) {
    v.copy(pos).project(camera);
    el.style.left = `${(v.x * 0.5 + 0.5) * host.clientWidth}px`;
    el.style.top = `${(-v.y * 0.5 + 0.5) * host.clientHeight}px`;
    el.style.display = v.z < 1 ? "" : "none";
  }

  // Browsers pause requestAnimationFrame in background tabs. Redraw once per data update
  // there, so a background tab still shows the current room.
  const drawIfPaused = () => { if (document.hidden) draw(performance.now()); };
  window.addEventListener("fleet:state", drawIfPaused);
  window.addEventListener("fleet:event", drawIfPaused);

  function frame(now) { draw(now); requestAnimationFrame(frame); }

  function draw(now) {
    const t = now / 1000;
    for (const d of desks.values()) {
      const working = d.status === "working";
      const bob = working && !reduced ? Math.sin(t * 7) * 0.025 : 0;
      d.body.position.y = 1.18 + bob;
      d.head.position.y = 1.78 + bob;
      d.head.rotation.x = working && !reduced ? Math.sin(t * 2.3) * 0.08 + 0.12 : 0;
      d.hands.forEach((h, i) => { h.position.y = 1.02 + (working && !reduced ? Math.max(0, Math.sin(t * 14 + i * Math.PI)) * 0.05 : 0); });
      d.screenLight.intensity = working ? 2.2 + (reduced ? 0 : Math.sin(t * 9) * 0.4) : 0;
      const top = d.head.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 0.55, 0));
      place(d.labelEl, top);
      place(d.bubbleEl, top);
      d.bubbleEl.style.opacity = now < d.bubbleUntil ? 1 : 0;
      d.bubbleEl.style.visibility = now < d.bubbleUntil + 400 ? "visible" : "hidden";
    }
    for (let i = envelopes.length - 1; i >= 0; i--) {
      const env = envelopes[i];
      const k = Math.min(1, (now - env.t0) / env.dur);
      env.m.position.lerpVectors(env.from, env.to, k);
      env.m.position.y += Math.sin(k * Math.PI) * 1.6;
      env.m.rotation.y = k * Math.PI * 2;
      if (k >= 1) { scene.remove(env.m); envelopes.splice(i, 1); }
    }
    controls.update();
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
