<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dashboard-token" content="__TOKEN__">
<title>Fleet Office</title>
<style>
  /* Neutral paper base, one accent (the send action), and one identity colour per agent.
     System fonts: this is a local tool and should not fetch web fonts. */
  :root {
    --bg: #f5f3ee; --surface: #ffffff; --ink: #1d1f22; --muted: #5d6166; --line: #e3dfd6;
    --accent: #1f6b58; --accent-ink: #ffffff; --warn: #a3521a; --ok: #2c7a3f;
    --floor: #e7e0d2; --wood: #b88a5c; --chair: #4a4f57; --skin: #e9c9a6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a; --surface: #1d2024; --ink: #e9e7e2; --muted: #a2a6ac; --line: #31353b;
      --accent: #5bbf9f; --accent-ink: #0d1a15; --warn: #e39a62; --ok: #6cc486;
      --floor: #25282c; --wood: #6d5641; --chair: #3a3e45; --skin: #d9b58f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171a; --surface: #1d2024; --ink: #e9e7e2; --muted: #a2a6ac; --line: #31353b;
    --accent: #5bbf9f; --accent-ink: #0d1a15; --warn: #e39a62; --ok: #6cc486;
    --floor: #25282c; --wood: #6d5641; --chair: #3a3e45; --skin: #d9b58f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-rows: auto 1fr; min-height: 100vh;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; padding: 14px 20px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  header .where { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  button { font: inherit; color: inherit; }
  .ghost {
    background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 0; }
  #scene { position: relative; min-height: 420px; overflow: hidden; }
  #scene canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .tag {
    position: absolute; transform: translate(-50%, -100%); white-space: nowrap; text-align: center;
    font-size: 13px; line-height: 1.25;
  }
  .tag b { display: block; font-size: 14px; }
  .tag span { color: var(--muted); }
  .tag.working span { color: var(--ok); font-weight: 600; }
  .tag.offline { opacity: .55; }
  .bubble {
    position: absolute; transform: translate(-50%, calc(-100% - 44px)); max-width: 260px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 11px; font-size: 13px; box-shadow: 0 6px 18px rgb(0 0 0 / .12);
    transition: opacity .3s;
  }
  .bubble small { display: block; color: var(--muted); font-size: 11.5px; margin-bottom: 2px; }
  .scene-note {
    position: absolute; left: 16px; bottom: 14px; color: var(--muted); font-size: 12.5px;
    pointer-events: none;
  }
  .scene-fallback {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
    color: var(--muted); text-align: center;
  }

  aside {
    border-left: 1px solid var(--line); background: var(--surface);
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0;
  }
  section { padding: 16px 18px; }
  section + section { border-top: 1px solid var(--line); }
  h2 { font-size: 13px; font-weight: 650; margin: 0 0 10px; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 600; color: var(--muted); padding: 0 6px 6px 0; font-size: 12px; }
  td { padding: 7px 6px 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .who { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; }
  .who:hover b { text-decoration: underline; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .state { display: inline-flex; align-items: center; gap: 6px; }
  .state i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .state.working i { background: var(--ok); }
  .state.offline { color: var(--muted); }
  .state.offline i { background: transparent; border: 1.5px solid var(--muted); }

  #feed-wrap { overflow: auto; }
  #feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  #feed li { font-size: 13.5px; }
  #feed .route { font-weight: 600; }
  #feed .route em { font-style: normal; color: var(--muted); font-weight: 400; }
  #feed time { color: var(--muted); font-size: 12px; margin-left: 6px; }
  #feed p { margin: 3px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  #feed li.task p { border-left: 2px solid var(--accent); padding-left: 8px; }
  .empty { color: var(--muted); font-size: 13.5px; margin: 0; }

  form { display: grid; gap: 10px; }
  .targets { display: flex; gap: 6px; flex-wrap: wrap; }
  .targets button {
    border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 11px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .targets button[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); font-weight: 600; }
  textarea {
    font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; min-height: 76px; resize: vertical;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .send {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
    padding: 9px 16px; font-weight: 650; cursor: pointer;
  }
  .send:disabled { opacity: .5; cursor: not-allowed; }
  #form-msg { color: var(--muted); font-size: 12.5px; }
  #form-msg.error { color: var(--warn); }
  #tasks { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
  #tasks .st { font-weight: 600; }
  #tasks .st.sending { color: var(--muted); }
  #tasks .st.done { color: var(--ok); }
  #tasks .st.failed { color: var(--warn); }
  #tasks p { margin: 2px 0 0; color: var(--muted); overflow-wrap: anywhere; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    #scene { height: 52vh; min-height: 320px; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) { .bubble { transition: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>Fleet Office</h1>
  <span class="where" id="where">Local sandbox, reading from this machine only</span>
  <span class="spacer"></span>
  <button class="ghost" id="theme" type="button">Theme: system</button>
</header>
<main>
  <div id="scene" aria-label="3D office showing each agent at a desk">
    <div class="overlay" id="overlay"></div>
    <div class="scene-note">Drag to turn the room. Click an agent to give it a task.</div>
  </div>
  <aside>
    <section>
      <h2>Agents</h2>
      <table>
        <thead><tr><th>Agent</th><th>Now</th><th>Last active</th><th class="num">Sent</th><th class="num">Got</th></tr></thead>
        <tbody id="agents"><tr><td colspan="5" class="empty">Connecting to the dashboard server…</td></tr></tbody>
      </table>
    </section>
    <section id="feed-wrap">
      <h2>Conversation</h2>
      <ul id="feed" aria-live="polite"></ul>
    </section>
    <section>
      <h2>Give a task</h2>
      <form id="task-form">
        <div class="targets" id="targets" role="group" aria-label="Send to"></div>
        <textarea id="task-text" aria-label="Task" maxlength="2000" placeholder="What should they do? For example: check whether a gpu_batch can run tonight and agree a time with each other."></textarea>
        <div class="row">
          <button class="send" id="send" type="submit" disabled>Send task</button>
          <span id="form-msg">Pick an agent first.</span>
        </div>
      </form>
      <ul id="tasks"></ul>
    </section>
  </aside>
</main>

<script type="module">
// ------------------------------------------------------------------ data, table, feed, tasks
const TOKEN = document.querySelector('meta[name="dashboard-token"]').content;
const COLORS = ["#d9822b", "#3a78c2", "#8a5cc2", "#2e9e8f", "#c2455d", "#6b8e23"];
const state = { agents: [], events: [], tasks: [], selected: null, seen: new Set(), first: true, now: Date.now() / 1000 };
const colorOf = name => COLORS[Math.max(0, state.agents.findIndex(a => a.name === name)) % COLORS.length];
const titleOf = name => name === "you" ? "You" : (state.agents.find(a => a.name === name)?.title
  ?? (name ? name[0].toUpperCase() + name.slice(1) : "Someone"));
window.fleet = { state, colorOf, titleOf };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ago(ts) {
  if (!ts) return "never";
  const s = Math.max(0, state.now - ts);
  if (s < 45) return "just now";
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return new Date(ts * 1000).toLocaleDateString();
}
const clock = ts => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const STATUS = { working: "Working", idle: "Idle", offline: "Offline" };

function renderAgents() {
  $("agents").innerHTML = state.agents.map(a => `
    <tr>
      <td><button class="who" type="button" data-pick="${esc(a.name)}" title="${esc(a.role)}">
        <span class="swatch" style="background:${colorOf(a.name)}"></span><b>${esc(a.title)}</b></button></td>
      <td><span class="state ${a.status}"><i></i>${STATUS[a.status]}</span></td>
      <td>${ago(a.last_ts)}</td>
      <td class="num">${a.sent}</td><td class="num">${a.received}</td>
    </tr>`).join("") || `<tr><td colspan="5" class="empty">No agents found. Start them with run_demo.py.</td></tr>`;
  $("where").textContent = `Local sandbox, ${state.agents.length} agents, reading from this machine only`;
  $("targets").innerHTML = state.agents.map(a => `
    <button type="button" data-pick="${esc(a.name)}" aria-pressed="${state.selected === a.name}">
      <span class="swatch" style="background:${colorOf(a.name)}"></span>${esc(a.title)}</button>`).join("");
}

function renderFeed() {
  const feed = $("feed");
  if (!state.events.length) {
    feed.innerHTML = `<li><p class="empty">No messages yet. Give an agent a task below and its conversation shows up here.</p></li>`;
    return;
  }
  const nearBottom = feed.parentElement.scrollHeight - feed.parentElement.scrollTop - feed.parentElement.clientHeight < 60;
  feed.innerHTML = state.events.map(e => {
    const route = e.kind === "reply"
      ? `<span style="color:${colorOf(e.from)}">${esc(titleOf(e.from))}</span> <em>says</em>`
      : `<span style="color:${e.from === "you" ? "inherit" : colorOf(e.from)}">${esc(titleOf(e.from))}</span> <em>to</em> <span style="color:${colorOf(e.to)}">${esc(titleOf(e.to))}</span>`;
    return `<li class="${e.kind}"><span class="route">${route}</span><time>${clock(e.ts)}</time><p>${esc(e.text)}</p></li>`;
  }).join("");
  if (nearBottom || state.first) feed.parentElement.scrollTop = feed.parentElement.scrollHeight;
}

function renderTasks() {
  const LABEL = { sending: "Waiting for an answer…", done: "Answered", failed: "Did not finish" };
  // The first reply is often "I've asked Chester, will confirm". Show the agent's latest
  // word since the task instead, so follow-ups from the conversation replace it.
  const latest = t => [...state.events].reverse()
    .find(e => e.kind === "reply" && e.from === t.agent && e.ts >= t.started)?.text;
  $("tasks").innerHTML = state.tasks.slice(0, 5).map(t => `
    <li><span class="st ${t.status}">${LABEL[t.status]}</span> · ${esc(titleOf(t.agent))} · ${clock(t.started)}
      <p>${esc((t.status === "sending" ? t.text : (latest(t) || t.reply || t.text)).slice(0, 280))}</p></li>`).join("");
}

function select(name) {
  state.selected = name;
  renderAgents();
  $("send").disabled = !name;
  $("form-msg").className = "";
  $("form-msg").textContent = name ? `Goes to ${titleOf(name)}. Takes a few seconds to a few minutes.` : "Pick an agent first.";
  if (name) $("task-text").focus();
}
document.addEventListener("click", e => {
  const pick = e.target.closest("[data-pick]");
  if (pick) select(pick.dataset.pick);
});
window.addEventListener("fleet:select", e => select(e.detail));

$("task-form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("task-text").value.trim();
  const msg = $("form-msg");
  if (!state.selected || !text) { msg.className = "error"; msg.textContent = "Pick an agent and write the task."; return; }
  $("send").disabled = true;
  try {
    const res = await fetch("/api/task", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Dashboard-Token": TOKEN },
      body: JSON.stringify({ agent: state.selected, text }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    $("task-text").value = "";
    msg.className = ""; msg.textContent = `Sent to ${titleOf(state.selected)}. Watch the office.`;
    window.dispatchEvent(new CustomEvent("fleet:event", { detail: { kind: "task", from: "you", to: state.selected, text, local: true } }));
    poll();
  } catch (err) {
    msg.className = "error"; msg.textContent = `Not sent: ${err.message}`;
  } finally {
    $("send").disabled = !state.selected;
  }
});

async function poll() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    Object.assign(state, { agents: data.agents, events: data.events, tasks: data.tasks, now: data.now });
    const fresh = data.events.filter(e => !state.seen.has(e.id));
    fresh.forEach(e => state.seen.add(e.id));
    renderAgents(); renderFeed(); renderTasks();
    window.dispatchEvent(new CustomEvent("fleet:state", { detail: state }));
    if (!state.first) fresh.forEach(e => window.dispatchEvent(new CustomEvent("fleet:event", { detail: e })));
    state.first = false;
  } catch (err) {
    $("agents").innerHTML = `<tr><td colspan="5" class="empty">Lost contact with the dashboard server (${esc(err.message)}). Is dashboard.py still running?</td></tr>`;
  }
}
poll();
setInterval(poll, 1500);

// Theme: follow the system unless the viewer picks one. Stored per browser only.
const themes = ["system", "light", "dark"];
let theme = "system";
try { theme = localStorage.getItem("fleet-theme") || "system"; } catch {}
function applyTheme() {
  if (theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  $("theme").textContent = `Theme: ${theme}`;
  window.dispatchEvent(new Event("fleet:theme"));
}
$("theme").addEventListener("click", () => {
  theme = themes[(themes.indexOf(theme) + 1) % themes.length];
  try { localStorage.setItem("fleet-theme", theme); } catch {}
  applyTheme();
});
applyTheme();
</script>

<script type="module">
// ------------------------------------------------------------------ the 3D office
// Only real state moves anything: an agent types while it is working, and an envelope
// crosses the room when one agent actually messages another.
let THREE, OrbitControls;
try {
  THREE = await import("three");
  ({ OrbitControls } = await import("three/addons/controls/OrbitControls.js"));
} catch {
  const note = document.createElement("div");
  note.className = "scene-fallback";
  note.textContent = "The 3D office needs three.js from cdn.jsdelivr.net, which did not load. The table, conversation and tasks still work.";
  document.getElementById("scene").append(note);
}

if (THREE) {
  const { fleet } = window;
  const host = document.getElementById("scene");
  const overlay = document.getElementById("overlay");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  host.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  camera.position.set(0, 7.5, 11);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.2, 0);
  controls.enableDamping = true;
  controls.minDistance = 6; controls.maxDistance = 22;
  controls.maxPolarAngle = Math.PI / 2.15;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8170, 1.1));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(5, 10, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 });
  scene.add(sun);

  const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85 });
  const floorMat = mat(css("--floor"));
  const woodMat = mat(css("--wood"));
  const chairMat = mat(css("--chair"));
  const skinMat = mat(css("--skin"));
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMat);
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
  scene.add(floor);

  function box(w, h, d, m, x, y, z) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    b.position.set(x, y, z); b.castShadow = b.receiveShadow = true;
    return b;
  }

  // The operator's in-tray at the front of the room: tasks from you start here.
  const tray = new THREE.Group();
  tray.add(box(1.0, 0.08, 0.7, woodMat, 0, 0.9, 0));
  [-0.4, 0.4].forEach(x => tray.add(box(0.08, 0.9, 0.08, woodMat, x, 0.45, 0)));
  tray.position.set(0, 0, 5.2);
  scene.add(tray);

  const desks = new Map();   // name -> { group, body, head, hands, screenLight, labelEl, bubbleEl, bubbleUntil }

  function makeDesk(name, color) {
    const g = new THREE.Group();
    const agentMat = mat(color);
    // desk, facing the camera; the agent sits behind it
    g.add(box(2.4, 0.1, 1.2, woodMat, 0, 0.9, 0));
    [[-1.1, -0.5], [1.1, -0.5], [-1.1, 0.5], [1.1, 0.5]].forEach(([x, z]) => g.add(box(0.08, 0.9, 0.08, woodMat, x, 0.45, z)));
    // monitor turned towards the agent, keyboard in front of it
    g.add(box(1.0, 0.62, 0.06, mat("#2b2e33"), 0, 1.37, 0.25));
    g.add(box(0.08, 0.3, 0.08, mat("#2b2e33"), 0, 1.08, 0.25));
    g.add(box(0.7, 0.03, 0.22, mat("#3b3f46"), 0, 0.97, -0.25));
    // chair
    g.add(box(0.7, 0.08, 0.65, chairMat, 0, 0.62, -0.95));
    g.add(box(0.7, 0.8, 0.08, chairMat, 0, 1.05, -1.28));
    // the agent: body in its identity colour, head, two hands on the keyboard
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.45, 6, 16), agentMat);
    body.position.set(0, 1.18, -0.95); body.castShadow = true;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 24, 16), skinMat);
    head.position.set(0, 1.78, -0.95); head.castShadow = true;
    const eyeMat = mat("#22252a");
    [-0.09, 0.09].forEach(x => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), eyeMat);
      eye.position.set(x, 0.04, 0.23); head.add(eye);
    });
    const hands = [-0.18, 0.18].map(x => {
      const h = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 10), skinMat);
      h.position.set(x, 1.02, -0.3); g.add(h); return h;
    });
    g.add(body, head);
    // screen glow on the agent's face while it works
    const screenLight = new THREE.PointLight(color, 0, 2.2);
    screenLight.position.set(0, 1.4, 0.05);
    g.add(screenLight);

    const labelEl = document.createElement("div");
    labelEl.className = "tag";
    const bubbleEl = document.createElement("div");
    bubbleEl.className = "bubble"; bubbleEl.style.opacity = 0;
    overlay.append(bubbleEl, labelEl);

    g.userData.agent = name;
    g.traverse(o => { o.userData.agent = name; });
    scene.add(g);
    return { group: g, body, head, hands, screenLight, agentMat, color, labelEl, bubbleEl, bubbleUntil: 0 };
  }

  function layout() {
    const names = [...desks.keys()];
    const n = names.length, spacing = 4.2;
    names.forEach((name, i) => {
      const d = desks.get(name);
      if (n <= 4) d.group.position.set((i - (n - 1) / 2) * spacing, 0, 0);
      else {
        const a = (i / n) * Math.PI * 2, r = Math.max(4, n * 0.9);
        d.group.position.set(Math.sin(a) * r, 0, Math.cos(a) * r - 1);
        d.group.lookAt(0, 0, 5);
      }
    });
  }

  window.addEventListener("fleet:state", e => {
    const { agents } = e.detail;
    let changed = false;
    agents.forEach(a => {
      if (!desks.has(a.name)) { desks.set(a.name, makeDesk(a.name, fleet.colorOf(a.name))); changed = true; }
      const d = desks.get(a.name);
      d.status = a.status;
      d.labelEl.className = `tag ${a.status}`;
      d.labelEl.innerHTML = `<b>${a.title}</b><span>${{ working: "Working", idle: "Idle", offline: "Offline" }[a.status]}</span>`;
      d.agentMat.color.set(a.status === "offline" ? "#8b8f96" : d.color);
    });
    if (changed) layout();
  });

  window.addEventListener("fleet:theme", () => {
    floorMat.color.set(css("--floor")); woodMat.color.set(css("--wood"));
    chairMat.color.set(css("--chair")); skinMat.color.set(css("--skin"));
    scene.background = new THREE.Color(css("--bg"));
  });
  scene.background = new THREE.Color(css("--bg"));

  function say(name, who, text) {
    const d = desks.get(name);
    if (!d) return;
    d.bubbleEl.innerHTML = `<small>${who}</small>${String(text).slice(0, 140).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))}${text.length > 140 ? "…" : ""}`;
    d.bubbleUntil = performance.now() + 8000;
  }

  // envelopes in flight
  const envelopes = [];
  const envGeo = new THREE.BoxGeometry(0.42, 0.04, 0.3);
  function send(fromPos, toPos, color) {
    const m = new THREE.Mesh(envGeo, new THREE.MeshStandardMaterial({ color: "#fbfaf6", roughness: 0.6 }));
    const flap = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.045, 0.1), new THREE.MeshStandardMaterial({ color }));
    flap.position.z = -0.1; m.add(flap);
    m.castShadow = true;
    scene.add(m);
    envelopes.push({ m, from: fromPos.clone(), to: toPos.clone(), t0: performance.now(), dur: reduced ? 1 : 1500 });
  }
  const headPos = name => {
    const d = desks.get(name);
    return d ? d.head.getWorldPosition(new THREE.Vector3()) : null;
  };

  window.addEventListener("fleet:event", e => {
    const ev = e.detail;
    if (ev.kind === "message") {
      const from = headPos(ev.from), to = headPos(ev.to);
      if (from && to) send(from, to, fleet.colorOf(ev.from));
      say(ev.from, `to ${fleet.titleOf(ev.to)}`, ev.text);
    } else if (ev.kind === "task") {
      const to = headPos(ev.to);
      if (to && ev.local) send(new THREE.Vector3(0, 1.1, 5.2), to, "#1f6b58");
      if (!ev.local) say(ev.to, "task from you", ev.text);
    } else if (ev.kind === "reply") {
      say(ev.from, "says", ev.text);
    }
  });

  // click an agent to address a task to it
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  let downAt = null;
  renderer.domElement.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener("pointerup", e => {
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects([...desks.values()].map(d => d.group), true)[0];
    if (hit?.object.userData.agent) window.dispatchEvent(new CustomEvent("fleet:select", { detail: hit.object.userData.agent }));
  });

  function resize() {
    const { clientWidth: w, clientHeight: h } = host;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(host);
  resize();

  const v = new THREE.Vector3();
  function place(el, pos) {
    v.copy(pos).project(camera);
    const r = host.getBoundingClientRect();
    el.style.left = `${(v.x * 0.5 + 0.5) * r.width}px`;
    el.style.top = `${(-v.y * 0.5 + 0.5) * r.height}px`;
    el.style.display = v.z < 1 ? "" : "none";
  }

  // Browsers pause requestAnimationFrame in background tabs. Redraw once per data update
  // there, so a background tab still shows the current room instead of an empty floor.
  const drawIfPaused = () => { if (document.hidden) draw(performance.now()); };
  window.addEventListener("fleet:state", drawIfPaused);
  window.addEventListener("fleet:event", drawIfPaused);

  function frame(now) {
    draw(now);
    requestAnimationFrame(frame);
  }

  function draw(now) {
    const t = now / 1000;
    for (const d of desks.values()) {
      const working = d.status === "working";
      const bob = working && !reduced ? Math.sin(t * 7) * 0.025 : 0;
      d.body.position.y = 1.18 + bob;
      d.head.position.y = 1.78 + bob;
      d.head.rotation.x = working && !reduced ? Math.sin(t * 2.3) * 0.08 + 0.12 : 0;
      d.hands.forEach((h, i) => { h.position.y = 1.02 + (working && !reduced ? Math.max(0, Math.sin(t * 14 + i * Math.PI)) * 0.05 : 0); });
      d.screenLight.intensity = working ? 2.2 + (reduced ? 0 : Math.sin(t * 9) * 0.4) : (d.status === "offline" ? 0 : 0.5);
      const top = d.head.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 0.55, 0));
      place(d.labelEl, top);
      place(d.bubbleEl, top);
      d.bubbleEl.style.opacity = now < d.bubbleUntil ? 1 : 0;
    }
    for (let i = envelopes.length - 1; i >= 0; i--) {
      const env = envelopes[i];
      const k = Math.min(1, (now - env.t0) / env.dur);
      env.m.position.lerpVectors(env.from, env.to, k);
      env.m.position.y += Math.sin(k * Math.PI) * 1.6;
      env.m.rotation.y = k * Math.PI * 2;
      if (k >= 1) { scene.remove(env.m); envelopes.splice(i, 1); }
    }
    controls.update();
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
