name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Code Style (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check client server tests setup.py fleet_wizard.py

  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Client extras (mcp, qdrant-client, fastembed) are required: without them the
          # MCP tool, key-separation and receipt tests skip themselves and CI passes blind.
          # Listed directly rather than via `pip install .`: setup.py doubles as the
          # setup wizard and would launch it for build commands it does not recognise.
          pip install pytest pytest-cov pytest-mock pydantic python-dotenv \
            fastapi uvicorn cryptography httpx \
            "mcp>=1.0.0" "qdrant-client>=1.10.0" "fastembed>=0.3.0"

      - name: Run Unit & Defense-in-Depth Tests
        run: |
          pytest tests/ -v --tb=short -rs
          python -c "import fleet_memory, sys; sys.exit(0 if fleet_memory.HAS_MCP else 'FastMCP missing: MCP tool tests were skipped')"
        env:
          PYTHONPATH: client

      - name: Run Control Plane Smoke Test
        run: |
          python server/control-plane/tests/smoke_test.py
