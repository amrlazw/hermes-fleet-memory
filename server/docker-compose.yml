version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: fleet-qdrant
    restart: always
    environment:
      - QDRANT__SERVICE__API_KEY=${FLEET_QDRANT_KEY}
    volumes:
      - ./qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  wstunnel:
    image: erebe/wstunnel:v10.7.1
    container_name: fleet-wstunnel
    restart: always
    # Loopback only: Caddy on :443 is the sole public entry and checks X-Fleet-Key.
    # Binding 0.0.0.0 here let anyone who reached :8443 skip that check.
    # The restriction file limits tunnels to the hub's Qdrant and the bridge port.
    command: >
      server
      --websocket-ping-frequency 30s
      --restrict-config /etc/wstunnel/restrictions.yaml
      ws://127.0.0.1:8443
    volumes:
      - ./wstunnel-restrictions.yaml:/etc/wstunnel/restrictions.yaml:ro
    network_mode: host

  caddy:
    image: caddy:2.9-alpine
    container_name: fleet-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    network_mode: host
